[workspace]
members = [
    "crates/dexbot-model",
    "crates/dexbot-cli",
    "crates/dexbot-capi",
]
resolver = "2"

[workspace.package]
version = "0.2.3"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-only OR LicenseRef-Dexmate-Commercial"
repository = "https://github.com/dexmate-ai/dexbot-utils"

[workspace.dependencies]
tempfile = "3"
clap = { version = "4.5", features = ["derive"] }
jsonschema = { version = "0.33", default-features = false }
quick-xml = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"

[profile.release]
lto = "thin"
strip = "symbols"
