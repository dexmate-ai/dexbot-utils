name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
    - name: Format
      run: cargo fmt --all --check
    - name: Lint
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Test
      run: cargo test --workspace --locked

  cpp-sdk:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate release configuration
        run: |
          python tools/check-release.py
          python -m unittest discover -s tools/tests -v
      - name: Build relocatable C++ SDK and check Rust parity
        run: |
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PWD/stage" -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build build --parallel 2
          cmake --install build
          python tools/test-sdk.py stage
      - name: Verify model crate packaging
        run: cargo package -p dexbot-model --locked
