[package]
name = "dexbot-utils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical robot profiles, configuration resolution, and URDF metadata for Dexmate robots"
readme = "README.md"
include = ["src/**", "assets/**", "examples/**", "tests/cli.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[lib]
name = "dexbot_utils"
path = "src/lib.rs"

[[bin]]
name = "dexbot"
path = "src/bin/dexbot/main.rs"

[dependencies]
clap.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
jsonschema.workspace = true
